name: "Build & Release"
on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"

permissions:
  contents: write

jobs:
  build-omp-launcher:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Scoop
        uses: MinoruSekine/setup-scoop@v5

      - name: Setup NSIS
        run: |
          scoop bucket add extras
          scoop install extras/nsis

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2024-01-01

      - name: Install frontend dependencies
        run: yarn install

      - name: Install rust i686-pc-windows-msvc target
        run: rustup target add i686-pc-windows-msvc

      - name: Build project
        run: yarn release

      - name: Prepare unsigned launcher
        shell: pwsh
        run: |
          Copy-Item `
            -LiteralPath "src-tauri/target/i686-pc-windows-msvc/release/omp-launcher.exe" `
            -Destination "unsigned-omp-launcher.exe" `
            -Force

      - name: Upload unsigned launcher
        uses: actions/upload-artifact@v7
        id: upload-launcher
        with:
          path: unsigned-omp-launcher.exe
          if-no-files-found: error
          archive: false

      - name: Sign launcher
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: fcba8f0f-2f8a-4e8a-bb02-1734b44f73ca
          project-slug: launcher
          signing-policy-slug: test-signing
          artifact-configuration-slug: omp-launcher-exe
          github-artifact-id: ${{ steps.upload-launcher.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-launcher
          skip-decompress: true

      - name: Restore launcher for NSIS
        shell: pwsh
        run: |
          if (Test-Path "signed-launcher/unsigned-omp-launcher.exe") {
            Copy-Item -LiteralPath "signed-launcher/unsigned-omp-launcher.exe" -Destination "src-tauri/target/i686-pc-windows-msvc/release/omp-launcher.exe" -Force
            Copy-Item -LiteralPath "signed-launcher/unsigned-omp-launcher.exe" -Destination "omp-launcher.exe" -Force
          } else {
            Copy-Item -LiteralPath "unsigned-omp-launcher.exe" -Destination "src-tauri/target/i686-pc-windows-msvc/release/omp-launcher.exe" -Force
            Copy-Item -LiteralPath "unsigned-omp-launcher.exe" -Destination "omp-launcher.exe" -Force
          }

      - name: Upload launcher
        uses: actions/upload-artifact@v7
        with:
          path: omp-launcher.exe
          if-no-files-found: error
          archive: false

      - name: Make NSIS archive
        run: yarn installer

      - name: Prepare unsigned installer
        shell: pwsh
        run: |
          Copy-Item `
            -LiteralPath "src-tauri/nsis/omp-launcher-setup.exe" `
            -Destination "unsigned-omp-launcher-setup.exe" `
            -Force

      - name: Upload unsigned installer
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          path: unsigned-omp-launcher-setup.exe
          if-no-files-found: error
          archive: false

      - name: Sign installer
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: fcba8f0f-2f8a-4e8a-bb02-1734b44f73ca
          project-slug: launcher
          signing-policy-slug: test-signing
          artifact-configuration-slug: omp-launcher-setup-exe
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
          skip-decompress: true

      - name: Finalize installer
        shell: pwsh
        run: |
          if (Test-Path "signed-installer/unsigned-omp-launcher-setup.exe") {
            Copy-Item -LiteralPath "signed-installer/unsigned-omp-launcher-setup.exe" -Destination "omp-launcher-setup.exe" -Force
          } else {
            Copy-Item -LiteralPath "unsigned-omp-launcher-setup.exe" -Destination "omp-launcher-setup.exe" -Force
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          path: omp-launcher-setup.exe
          if-no-files-found: error
          archive: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build ModSync Client Engine
        run: |
          dotnet publish client/ModSyncLauncher/ModSyncLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o client-publish

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            omp-launcher-setup.exe
            omp-launcher.exe
            client-publish/ModSyncLauncher.exe
          generate_release_notes: false
